# The toolchain this repository is, pinned rather than assumed.
#
# GOWORK = "off" because this estate deliberately has no go.work: a workspace
# silently changes which code builds, and the previous estate spent real time on
# LSP errors that were a workspace artefact rather than a compile failure.
[tools]
go = "1.26"
buf = "1"

[env]
GOWORK = "off"

[tasks.gen]
description = "Regenerate the Go from the protos"
# Two templates, because examples/proto is its own buf module and the examples
# exist to model two repositories each generating their own.
run = """
set -e
buf generate
buf generate --template buf.gen.examples.yaml
"""

[tasks."gen-check"]
description = "Fail if the committed generated Go is not what the protos produce"
# The generated code is committed, so a reader sees what the options compile to
# without running buf. That is only true if something checks the two agree.
# `git status --porcelain`, NOT `git diff --exit-code`. git diff cannot see an
# untracked file, so the previous form passed vacuously for generated code that
# was NEW -- which is precisely the case a check like this exists to catch, and
# precisely what the first run of protoc-gen-garm-go produced. It was green and
# blind at the same time.
run = """
set -e
buf generate
buf generate --template buf.gen.examples.yaml
dirty="$(git status --porcelain -- garm/ testdata/ examples/gen/)"
if [ -n "$dirty" ]; then
  echo "$dirty" >&2
  echo "the committed tree is not what the protos produce." >&2
  echo "If you just ran 'mise run gen', the files above are its output -- commit them." >&2
  exit 1
fi
"""

[tasks.check]
description = "Refuse a tree whose declarations do not hold together"
# buf compiles; garm-check answers what protobuf cannot express. An allowlist
# cites tools by NAME, so it creates no proto dependency and no proto error --
# nothing but this will tell you an entry resolves to nothing.
run = """
set -e
mkdir -p build
# `proto` as an INPUT, not via --path: examples/proto is a second module now,
# and building the whole tree would put the examples in this repo's own image,
# making the tool count mean two things at once. buf refuses --path for a path
# that IS a module, which is how this was found.
buf build proto -o build/image.binpb
go run ./cmd/garmctl compose images.yaml -o build/catalogue.binpb
"""

[tasks.examples]
description = "Compose the example namespace, the way two repositories would"
# The guide in docs/guide.md walks through exactly these files. Running it in CI
# is what stops the guide from lying: rename a field and the guide breaks here
# rather than misleading somebody next month.
run = """
set -e
mkdir -p build
buf build --path examples/proto/weather -o build/weather.binpb
buf build --path examples/proto/trips   -o build/trips.binpb
go run ./cmd/garmctl compose examples/images.yaml
"""

[tasks.lint]
description = "buf lint and go vet"
run = """
set -e
buf lint
go vet ./...
"""

[tasks.test]
description = "go test"
run = "go test ./... -race"

[tasks.ci]
description = "Everything CI runs, in order"
depends = ["lint", "gen-check", "check", "examples", "test"]
