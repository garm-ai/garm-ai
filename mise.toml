# The toolchain this repository is, pinned rather than assumed.
#
# GOWORK = "off" because this estate deliberately has no go.work: a workspace
# silently changes which code builds, and the previous estate spent real time on
# LSP errors that were a workspace artefact rather than a compile failure.
[tools]
go = "1.26"
buf = "1"

[env]
GOWORK = "off"

[tasks.gen]
description = "Regenerate the Go from the protos"
# Two templates, because examples/proto is its own buf module and the examples
# exist to model two repositories each generating their own.
run = """
set -e
buf generate
buf generate --template buf.gen.examples.yaml
"""

[tasks."gen-check"]
description = "Fail if the committed generated Go is not what the protos produce"
# The generated code is committed, so a reader sees what the options compile to
# without running buf. That is only true if something checks the two agree.
# A generated file that exists but was never added is stale in exactly the way
# this check exists to catch, so the untracked check sits beside the diff.
#
# Both halves are needed and neither alone is enough. `git diff` cannot see an
# untracked file -- the earlier form here used `git diff --exit-code` alone and so
# passed vacuously for generated code that was NEW, which was the first thing this
# repository generated. And `git status --porcelain` folds an untracked directory
# into one `?? examples/gen/` line, naming no file a reader can open, which is why
# `ls-files --others` does the second half. This is the shape artefactd, tasksd and
# tools already use; contracts and examples still have the diff half only.
run = """
set -e
paths="garm testdata examples/gen"
buf generate
buf generate --template buf.gen.examples.yaml
if ! git diff --quiet -- $paths; then
  git diff --stat -- $paths >&2
  echo "generated Go is stale: run 'mise run gen' and commit the result" >&2
  exit 1
fi
untracked=$(git ls-files --others --exclude-standard -- $paths)
if [ -n "$untracked" ]; then
  printf '%s\n' "$untracked" >&2
  echo "generated Go is untracked: run 'git add' on the files above" >&2
  exit 1
fi
"""

[tasks.check]
description = "Refuse a tree whose declarations do not hold together"
# buf compiles; garm-check answers what protobuf cannot express. An allowlist
# cites tools by NAME, so it creates no proto dependency and no proto error --
# nothing but this will tell you an entry resolves to nothing.
run = """
set -e
mkdir -p build
# `proto` as an INPUT, not via --path: examples/proto is a second module now,
# and building the whole tree would put the examples in this repo's own image,
# making the tool count mean two things at once. buf refuses --path for a path
# that IS a module, which is how this was found.
buf build proto -o build/image.binpb
go run ./cmd/garmctl compose images.yaml -o build/catalogue.binpb
"""

[tasks.examples]
description = "Compose the example namespace, the way two repositories would"
# The guide in docs/guide.md walks through exactly these files. Running it in CI
# is what stops the guide from lying: rename a field and the guide breaks here
# rather than misleading somebody next month.
run = """
set -e
mkdir -p build
buf build --path examples/proto/weather -o build/weather.binpb
buf build --path examples/proto/trips   -o build/trips.binpb
go run ./cmd/garmctl compose examples/images.yaml
"""

[tasks.lint]
description = "buf lint and go vet"
run = """
set -e
buf lint
go vet ./...
"""

[tasks."no-broker"]
description = "Refuse a tool author's build that can reach a message broker"
# serve/serve.go's doc comment claims a tool module does not inherit a transport's
# dependency tree. That claim was true when written and nothing kept it true: one
# import added to serve for convenience would make every tool service resolve
# nats.go, and the comment would still read as a guarantee.
#
# The shape is copied from the previous estate's `no-daemon-dependency` CI job,
# which existed for the same reason and is the one boundary check there that worked.
run = """
set -e
for pkg in ./serve ./declared ./images ./fetch ./examples/gen/...; do
  if go list -deps "$pkg" 2>/dev/null | grep -q 'nats-io'; then
    echo "$pkg reaches a NATS package:" >&2
    go list -deps "$pkg" | grep 'nats-io' >&2
    echo "generated code and the seam it is written against must not import a broker" >&2
    exit 1
  fi
done
"""

[tasks.test]
description = "go test"
run = "go test ./... -race"

[tasks.ci]
description = "Everything CI runs, in order"
depends = ["lint", "gen-check", "no-broker", "check", "examples", "test"]
