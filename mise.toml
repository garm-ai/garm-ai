# The toolchain this repository is, pinned rather than assumed.
#
# GOWORK = "off" because this estate deliberately has no go.work: a workspace
# silently changes which code builds, and the previous estate spent real time on
# LSP errors that were a workspace artefact rather than a compile failure.
[tools]
go = "1.26.6"
buf = "1"
# The quick start's server and the CLI that reads $SRV.PING, pinned like the
# rest: a getting-started that assumes a tool on PATH is a getting-started that
# works on one laptop. nats-server matches the version the tests embed.
"go:github.com/nats-io/nats-server/v2" = "2.15.0"
"go:github.com/nats-io/natscli/nats" = "0.5.0"

[env]
GOWORK = "off"

[tasks.gen]
description = "Regenerate the Go from the protos"
# Two templates, because examples/proto is its own buf module and the examples
# exist to model two repositories each generating their own.
run = """
set -e
buf generate
buf generate --template buf.gen.examples.yaml
"""

[tasks."gen-check"]
description = "Fail if the committed generated Go is not what the protos produce"
# The generated code is committed, so a reader sees what the options compile to
# without running buf. That is only true if something checks the two agree.
# A generated file that exists but was never added is stale in exactly the way
# this check exists to catch, so the untracked check sits beside the diff.
#
# Both halves are needed and neither alone is enough. `git diff` cannot see an
# untracked file -- the earlier form here used `git diff --exit-code` alone and so
# passed vacuously for generated code that was NEW, which was the first thing this
# repository generated. And `git status --porcelain` folds an untracked directory
# into one `?? examples/gen/` line, naming no file a reader can open, which is why
# `ls-files --others` does the second half. This is the shape artefactd, tasksd and
# tools already use; contracts and examples still have the diff half only.
run = """
set -e
paths="garm testdata examples/gen"
buf generate
buf generate --template buf.gen.examples.yaml
if ! git diff --quiet -- $paths; then
  git diff --stat -- $paths >&2
  echo "generated Go is stale: run 'mise run gen' and commit the result" >&2
  exit 1
fi
untracked=$(git ls-files --others --exclude-standard -- $paths)
if [ -n "$untracked" ]; then
  printf '%s\n' "$untracked" >&2
  echo "generated Go is untracked: run 'git add' on the files above" >&2
  exit 1
fi
"""

[tasks.check]
description = "Refuse a tree whose declarations do not hold together"
# buf compiles; garm-check answers what protobuf cannot express. An allowlist
# cites tools by NAME, so it creates no proto dependency and no proto error --
# nothing but this will tell you an entry resolves to nothing.
run = """
set -e
mkdir -p build
# `proto` as an INPUT, not via --path: examples/proto is a second module now,
# and building the whole tree would put the examples in this repo's own image,
# making the tool count mean two things at once. buf refuses --path for a path
# that IS a module, which is how this was found.
buf build proto -o build/image.binpb
go run ./cmd/garmctl compose images.yaml -o build/catalogue.binpb
"""

[tasks.examples]
description = "Compose the example namespace, the way two repositories would"
# The guide in docs/guide.md walks through exactly these files. Running it in CI
# is what stops the guide from lying: rename a field and the guide breaks here
# rather than misleading somebody next month.
run = """
set -e
mkdir -p build
buf build --path examples/proto/weather -o build/weather.binpb
buf build --path examples/proto/trips   -o build/trips.binpb
go run ./cmd/garmctl compose examples/images.yaml
"""

[tasks."guide-files"]
description = "Fail if docs/guide.md, README.md, docs/concepts.md or docs/operating-the-topology.md names a file the repository does not have"
# The guide's first line promises every file it names is in the repository. That
# promise is worth exactly as much as something checking it -- and the first draft
# of step 9c's section named examples/cmd/trip, which did not exist. The README
# and the concepts page are held to the same promise: they are the front door, and
# a front door naming a package that moved is the stale-docs failure in its purest
# form. Paths in code fences count too (`./cmd/rund` in the quick start).
run = '''
set -e
missing=0
for doc in docs/guide.md README.md docs/concepts.md docs/operating-the-topology.md; do
  for f in $(grep -oE '(`|\./)(examples|docs|proto|cmd|observe|topology|natsserve|natsmicro|natsconn|natscall|rundsvc|run|serve|call|catalogue|declared|fetch|images|internal)/[a-zA-Z0-9_./-]+' "$doc" | sed 's/^[`.]*\/*//; s/`$//' | sort -u); do
    if [ ! -e "$f" ]; then echo "$doc names $f, which does not exist" >&2; missing=1; fi
  done
done
exit $missing
'''

[tasks.lint]
description = "buf lint and go vet"
run = """
set -e
buf lint
go vet ./...
"""

[tasks."no-broker"]
description = "Refuse a tool author's build that can reach a message broker"
# serve/serve.go's doc comment claims a tool module does not inherit a transport's
# dependency tree. That claim was true when written and nothing kept it true: one
# import added to serve for convenience would make every tool service resolve
# nats.go, and the comment would still read as a guarantee.
#
# The shape is copied from the previous estate's `no-daemon-dependency` CI job,
# which existed for the same reason and is the one boundary check there that worked.
#
# Extended for OpenTelemetry in the same breath: `serve`, `call` and generated code
# must not import it either -- the span lives on the transport, and a tool author
# who wants to add to it imports the OTel API in their own module, by choice.
run = """
set -e
for pkg in ./serve ./call ./declared ./images ./fetch ./run ./examples/gen/...; do
  if go list -deps "$pkg" 2>/dev/null | grep -Eq 'nats-io|go.opentelemetry.io'; then
    echo "$pkg reaches a broker or OTel package:" >&2
    go list -deps "$pkg" | grep -E 'nats-io|go.opentelemetry.io' >&2
    echo "generated code and the seam it is written against import neither a broker nor OTel" >&2
    exit 1
  fi
done
"""

[tasks."no-sdk"]
description = "Refuse an OTel SDK import anywhere but observe/otlp, and a DBOS import anywhere but rundbos"
# observe/otlp.Start configures the SDK, once, at the top of every main. Every
# other package uses the API, which is a no-op until then -- so a tool author
# with their own OTel setup is not fought, and a library here never installs
# process-global state on anyone's behalf (observability spec §7). Proved to
# fail: with `import _ "go.opentelemetry.io/otel/sdk/trace"` in natsserve.
run = """
set -e
for pkg in ./natsserve ./rundsvc ./natscall ./natsmicro ./observe ./topology; do
  if go list -deps "$pkg" 2>/dev/null | grep -Eq 'go.opentelemetry.io/otel/(sdk|exporters)'; then
    echo "$pkg reaches the OTel SDK:" >&2
    go list -deps "$pkg" | grep -E 'go.opentelemetry.io/otel/(sdk|exporters)' >&2
    echo "only observe/otlp configures the SDK; everything else uses the API" >&2
    exit 1
  fi
done
# The run store is DBOS, and ONLY rundbos imports it (run-store spec §1): the
# engine, the transport, the client and the generated code see run.Store, never
# the SDK -- so the store can be replaced without touching a caller. Proved to
# fail: with `import _ "github.com/garm-ai/garm-ai/rundbos"` in run.
for pkg in ./run ./rundsvc ./natscall ./call ./serve ./internal/generate ./examples/gen/...; do
  if go list -deps "$pkg" 2>/dev/null | grep -q 'dbos-inc'; then
    echo "$pkg reaches the DBOS SDK:" >&2
    go list -deps "$pkg" | grep 'dbos-inc' >&2
    echo "only rundbos imports DBOS; everything else uses run.Store" >&2
    exit 1
  fi
done
"""

[tasks.test]
description = "go test"
run = "go test ./... -race"

[tasks.e2e]
description = "The quick start, end to end, on this laptop: a server, weatherd, rund with a SQLite run store, one forecast, one async run; not in CI (it binds 127.0.0.1:4222)"
# README.md's Getting started is a claim; this is the thing that checks it. Not
# in CI because it takes the laptop's 4222 and 8080/8081 -- the dev-boot test in
# cmd/garmctl is the in-process version and IS in CI.
run = "bash scripts/e2e.sh"

[tasks."e2e-compose"]
description = "The quick start against compose.yaml's nats, OpenObserve and Postgres: the forecast, one async run through the Postgres run store, both traces looked up in OpenObserve"
# docker compose up -d first (after garmctl topology --dev -o build/topo). This
# is the proof that the OTLP path reaches a real backend, not only the fake
# receiver the unit tests use. NATS_PORT and O2_PORT follow compose.yaml's.
run = "bash scripts/e2e.sh compose"

[tasks.bench]
description = "The per-call cost of the whole chain; not in CI, by design"
# A benchmark that gates a build is a flaky build. Run it when something on the
# call path changes and put the number in docs/performance.md beside the last one.
run = "go test ./natscall/ -run '^$' -bench 'BenchmarkTheLoop' -benchtime 2s -count 3"

[tasks.tidy]
description = "Fail if go.mod is not what 'go mod tidy' would write"
# A dependency promoted from indirect to direct, or dropped, shows up here and
# nowhere else: the build does not care, and a reviewer reading go.mod is told the
# wrong thing. `go mod tidy -diff` exits non-zero when it would change anything,
# which is the whole check. Proved to fail: this task was added while go.mod still
# listed a directly-imported module as indirect, and it failed until 'go mod tidy'.
run = "go mod tidy -diff"

[tasks.breaking]
description = "Fail if a proto change would break a caller built against main"
# The contract says v1. This is the only thing that makes that true: a renumbered
# field, a removed message, a changed type compiles fine and breaks every caller
# built before it, and nothing else here would notice. Compared against main, so a
# pull request is caught; on main itself it compares main to main and passes.
# Proved to fail: renumbering a field in error.proto made it exit 100.
run = "buf breaking --against '.git#branch=main'"

[tasks.vuln]
description = "Fail on a known vulnerability in any dependency"
# Nine direct dependencies and a public repository. govulncheck reports only
# vulnerabilities in code paths this module actually reaches, so a finding is a
# real one. Pinned, because a check that moves on its own is a check nobody can
# reproduce. Not proved to fail: there is no vulnerable dependency to prove it
# with, and adding one on purpose is the wrong kind of proof.
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./..."

[tasks.ci]
description = "Everything CI runs, in order"
depends = ["lint", "breaking", "vuln", "gen-check", "no-broker", "no-sdk", "guide-files", "tidy", "check", "examples", "test"]
