// A tool: something a service answers itself.
syntax = "proto3";

package weather.v1;

import "garm/tool/v1/tool.proto";

option go_package = "github.com/garm-ai/garm-ai/examples/gen/weather/v1;weatherv1";

message GetForecastRequest {
  string place = 1;
  int32 days = 2;
}

message GetForecastResponse {
  string summary = 1;
  int32 high_celsius = 2;
}

message ScheduleReportRequest {
  string place = 1;
}

message ScheduleReportResponse {
  string report_id = 1;
}

service WeatherService {
  rpc GetForecast(GetForecastRequest) returns (GetForecastResponse) {
    // The name is how everything else refers to this tool: an agent's allowlist,
    // a policy, a log line. The method's proto full name
    // (`weather.v1.WeatherService.GetForecast`) is where the declaration LIVES
    // and is never used as identity.
    option (garm.tool.v1.tool) = {
      name: "weather.v1.get_forecast"
      // SYNC IS A SAFETY CLAIM, not a speed one: it says the answer comes back
      // inside 5s AND that no policy may interpose a human. A tool that might
      // ever need approval declares async instead.
      sync: { budget: { seconds: 5 } }
    };
  }

  rpc ScheduleReport(ScheduleReportRequest) returns (ScheduleReportResponse) {
    // ASYNC: the caller gets a run id back, not an answer, and reads the run
    // later. Nothing about the handler changes -- it is the same plain method
    // shape as GetForecast; what changes is who waits. The caller MUST send an
    // idempotency key (it becomes the run id), and a policy may one day put a
    // human between the call and the handler, which a sync tool forbids.
    option (garm.tool.v1.tool) = {
      name: "weather.v1.schedule_report"
      // The LIMIT is how long one call to this handler may take, made by rund
      // from the queue: the handler's own deadline and rund's request timeout,
      // both from here. Not how long the run may take.
      async: { limit: { seconds: 60 } }
      // WHAT A CALLER MUST HOLD. A report costs something to produce, so this
      // one asks; the forecast beside it asks nothing, and the two together are
      // what make the quick start exercise both halves of the authority model.
      requires: { compartments: ["weather"] }
    };
  }
}
