// The platform's own front door.
//
// DELIBERATELY NOT A SET OF TOOLS, and the reason is recursion: invoking a tool
// goes THROUGH this, so if `invoke` were itself a tool then invoking it would
// create a run that invoked it. "Everything is a tool" governs what the platform
// serves on behalf of others, not the door you come in by.
syntax = "proto3";

package garm.run.v1;

import "garm/invoke/v1/error.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/garm-ai/garm-ai/garm/run/v1;runv1";

service RunService {
  // Invoke starts a run. THE ONLY WAY A CALLER REACHES A TOOL.
  //
  // A caller never addresses `garm.tool.<name>` itself. That subject is the
  // INTERNAL calling convention between rund and a tool service, which is what
  // lets asynchrony and approval be imposed later on a tool that knows about
  // neither.
  rpc Invoke(InvokeRequest) returns (InvokeResponse);

  // Fetch is what happened. Today it answers honestly that a synchronous run is
  // not retained; it returns a result when there is a store to hold one.
  rpc Fetch(FetchRequest) returns (FetchResponse);
}

message InvokeRequest {
  // The tool's declared NAME. Identity, never an address: a caller asks for
  // `payments.v1.get_balance` and never for a proto path.
  string tool = 1;

  // The tool's request message, marshalled.
  //
  // `bytes`, NOT google.protobuf.Any. An Any carries a type URL, which is a
  // SECOND statement of a type the tool name already determines -- two sources
  // that can disagree, about the one thing this platform refuses to state twice.
  // rund holds the catalogue, so it can decode this for a log line without the
  // wire carrying a redundant claim.
  //
  // THIS IS THE ONLY FIELD A MODEL'S OUTPUT EVER REACHES. Everything that governs
  // a call -- the ids, the budget, an idempotency key -- travels in NATS HEADERS,
  // which the caller's runtime sets and a model cannot. That is structural rather
  // than a rule somebody has to remember: a model produces arguments, and
  // arguments are in here.
  bytes input = 2;
}

message InvokeResponse {
  // Always set. Every call has a run, whether or not anything is stored under it.
  //
  // Distinct from the correlation id: a correlation spans one caller's flow,
  // which may start several runs.
  string run_id = 1;

  // The second arm joined when the run store did, additively -- which is why
  // the oneof was there with one arm from the start.
  oneof outcome {
    // The tool answered within its declared budget. Only possible for a tool
    // whose delivery is Sync.
    bytes result = 2;
    // The run is durable and will execute without the caller. Only possible
    // for a tool whose delivery is Async, and only when the caller supplied an
    // idempotency key: that key is the run id, so a retry of Invoke is the same
    // run and never a second one.
    Pending pending = 3;
  }
}

// Pending carries nothing today. A message rather than a bool so that what a
// pending run can say about itself (a queue position, an estimate) is additive.
message Pending {}

message FetchRequest {
  string run_id = 1;

  // How long rund may hold the request before answering, when the run is still
  // RUNNING. Zero answers at once. rund caps this (30s): a request must never
  // outlive the bus's own timeouts. A blocking Fetch is how a caller waits for
  // an answer without polling -- one request in flight, not one per second.
  google.protobuf.Duration wait = 2;
}

message FetchResponse {
  RunState state = 1;

  // Set when the run reached a terminal state. A FAILED run's error is the
  // tool's own, with its kind, as a sync caller would have received it.
  oneof outcome {
    bytes result = 2;
    garm.invoke.v1.Error error = 3;
  }

  // Where the run is, in the run's own words: `queued`, `calling:<i>`, `done`.
  // A word and a reference, never a payload. Empty for a run that has no store.
  string stage = 4;

  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp completed_at = 6;

  // The tool the run invoked, so a caller holding only a run id can decode the
  // result against the catalogue.
  string tool = 7;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;

  // The run happened and nothing was kept. The honest answer for a synchronous
  // call in a build with no store: NOT a lie that it never existed, and not a
  // fabricated result.
  RUN_STATE_NOT_RETAINED = 1;

  // Durable and not yet finished: queued for a replica, or executing. One
  // state for both, because the caller's question is "is there an answer yet".
  RUN_STATE_RUNNING = 2;
  RUN_STATE_SUCCEEDED = 3;
  RUN_STATE_FAILED = 4;
  // Cancelled by an operator (the store's own command) before it finished.
  RUN_STATE_CANCELLED = 5;

  // WAITING_FOR_APPROVAL, WAITING_FOR_INFO, CANCELLING and TIMED_OUT arrive
  // with the slices that produce them. See docs/roadmap.md.
}
