// What a tool declares about itself. An agent is a tool.
//
// This file is deliberately almost empty, and growing it has a rule: **a field
// arrives when the thing that enforces it arrives, never before.** An audit of
// the estate this replaces traced every field of its tool and agent options to
// an enforcer and found five declared and enforced by nothing -- including one
// whose own comment admitted it was "parsed by lint, not evaluated", and a whole
// instance-authorization vocabulary with no implementation. None of it was
// carelessness; each was added in good faith slightly ahead of its enforcer and
// nothing ever checked the gap. The gap is what this file refuses to open.
syntax = "proto3";

package garm.tool.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/garm-ai/garm-ai/garm/tool/v1;toolv1";

// A tool IS an RPC method carrying this option. There is no registry, manifest
// or list of tools: the declaration lives on the thing it describes, so the two
// cannot disagree.
//
// 50002 is the number the previous contracts used for the same option. A
// familiar number costs nothing; a gratuitously different one invites a mistake.
extend google.protobuf.MethodOptions {
  Tool tool = 50002;
}

message Tool {
  // The tool's ONE identity. Policy keys on it, logs name it, allowlists cite
  // it, tokens carry it.
  //
  // THE METHOD'S PROTO FULL NAME IS AN ADDRESS, NEVER AN IDENTITY. That sentence
  // is the whole point of this field and the direct fix for the two most
  // expensive bugs in the estate this replaces: an agent had a short declared
  // name AND a proto full name, both were used as identity in different places,
  // and twice a component passed one where another expected the other. Each time
  // the symptom was a refusal with a correct-looking message and a cause three
  // services away.
  //
  // One spelling. If you hold `testdata.v1.SupportAssistantService.Invoke` and
  // something wants a tool, you hold an address and must look up the name. If
  // you are tempted to add a second identity field, that is this bug returning.
  //
  // Explicit rather than derived from the method path, because an identity
  // derived from a path changes when the path does, and then every policy that
  // keys on it silently stops matching. Uniqueness therefore needs a lint rule,
  // which arrives with the linter.
  string name = 1;

  // HOW THIS TOOL IS ANSWERED, and the whole of what an "agent" is.
  //
  // Absent: a service answers the call itself. A balance lookup, a payment.
  // Present: a RUNNER answers it, and this says what that run may call in turn.
  //
  // This replaces a split that cost the previous estate real money. There, a
  // tool option sat on each method and a separate AGENT option sat on the
  // service, at a different level, with its own identity -- and the two had to
  // be kept consistent by a lint rule (A5, `lintAgentDoorParity`) that existed
  // for no other reason. Meanwhile an agent already appeared in other agents'
  // allowlists as a plain tool name, so the model was half-unified in practice
  // and fully split in the contract.
  //
  // The distinction that actually matters is not tool-versus-agent. It is **who
  // answers this call** -- a service, or the platform. That is one optional
  // field, not two option types at two attachment levels.
  Agent agent = 2;

  // How the answer arrives.
  //
  // A ONEOF, so a tool cannot forget to say -- and "forgot" must not quietly
  // become one of them. The two are not interchangeable: a caller waiting for an
  // answer and a caller holding a receipt write different code.
  oneof delivery {
    Sync sync = 3;
    Async async = 4;
  }

  // WHAT A CALLER MUST HOLD, declared by the only party who knows: this tool's
  // author. A property of the TOOL -- "this moves money" -- and never of a
  // caller: nothing here names a principal, a role or a team, because a tool's
  // author does not know who should hold what, and a declaration that named
  // them would be policy written by the wrong person (authority spec §1).
  //
  // Absent means the tool asks nothing. It does NOT mean "open": with a grant
  // source configured, a principal still needs a grant admitting the tool.
  Requirement requires = 5;
}

// What a caller must hold to invoke a tool.
message Requirement {
  // Every compartment a caller must hold -- ALL of them, not any. A compartment
  // is a name a deployment owns, declared in its grants; a requirement naming
  // one no deployment declares is a tool nobody can call, and rund refuses to
  // start rather than refuse every call (authority spec §6).
  repeated string compartments = 1;

  // A bound over the REQUEST -- "never above EUR 1m, whoever asks" -- belongs
  // here rather than in a grant, because it is a fact about this tool, true of
  // every caller. It is absent because nothing evaluates it yet, and a
  // declaration nothing enforces reads as a guarantee.
}

// Sync: the answer comes back on the reply, within a budget.
//
// NOT A CLAIM ABOUT BEING FAST. A tool that pages a ledger for ten seconds is
// synchronous; one that takes a millisecond but may pause for a person is not.
// The axis is whether STATE OUTLIVES THE CALL.
//
// And declaring it is a claim about SAFETY: see budget.
message Sync {
  // How long a caller must be prepared to wait, declared by the only party who
  // knows -- the tool's author.
  //
  // DECLARING Sync DECLARES THAT NO HUMAN MAY BE INTERPOSED, and that is what
  // makes this number honest. Approval can otherwise be attached to any call by
  // policy, which would turn a truthful `2s` into four hours without the author
  // doing anything wrong. A tool that might ever need a person declares Async.
  //
  // Required and positive: a sync tool with no budget leaves a caller no deadline
  // to use but one it invented, which is the guessing this field exists to end.
  google.protobuf.Duration budget = 1;
}

// Async: the call returns a reference and the state outlives it.
message Async {
  // How long ONE CALL to the handler may take, made by rund from the run's
  // queue rather than by the caller. The same two-enforcer shape as Sync.budget:
  // rund's request to the tool expires at it, and the handler's own deadline is
  // it, both read from this declaration. A limit the platform invented would be
  // retried into duplicate work; the author is the one party who knows.
  //
  // Required and positive for a tool a service answers. An agent declares none:
  // nothing calls an agent's handler, and its own steps carry theirs. A limit on
  // the RUN -- how long the whole thing may take across steps and waits -- is a
  // different concept and arrives with a decider.
  google.protobuf.Duration limit = 1;
}

// What rund runs when a tool declares one.
//
// NOTE WHAT IS ABSENT: no field names WHICH IMPLEMENTATION decides this agent's
// steps -- DBOS or Temporal, react-v2 or react-experimental. That is a
// deployment's topology, settled by rund's own routing table, and a tool author
// who could name it would be choosing somebody else's deployment.
//
// A field naming the KIND -- ReAct, Workflow -- will arrive when a decider does,
// because by then it has readers: compose can refuse a Workflow declaring no
// steps, and a declared kind can be reconciled against what is actually serving.
// It is absent today for the reason at the top of this file, and for no other.
// An agent may never declare Sync, and compose refuses one that does: both decider
// kinds are durable by definition, so an agent cannot complete inside a call.
message Agent {
  // What a run may call, and the only thing currently enforced.
  //
  // THE ALLOWLIST IS THE ONLY AUTHORITY on what a run may call. Nothing widens
  // it -- not a prompt, not a graph, not a runtime decision. When something that
  // orders calls arrives, it will be able to order only what is already here.
  //
  // Entries name tools by `Tool.name`, the same spelling a tool declares for
  // itself. One namespace: an agent in another agent's allowlist is an ordinary
  // entry, because an agent is an ordinary tool.
  repeated ToolRef tools = 1;
}

// One entry in an allowlist.
//
// A message rather than a bare string, so this grows without a breaking change:
// a guard, a per-tool ceiling, a rate can each arrive as a field when its
// enforcer does. It carries a name and nothing else today, on purpose -- the
// message exists so the NEXT thing has somewhere to go, not so fields can be
// declared ahead of the code that honours them.
message ToolRef {
  // The tool, by its declared `Tool.name`.
  string name = 1;
}
