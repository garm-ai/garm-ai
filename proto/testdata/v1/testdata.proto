// Two tools: one a service answers itself, one a runner answers. A test reads
// both back off a real compiled descriptor rather than off structs it filled in.
//
// That distinction is not pedantry. In the estate this replaces, four separate
// tests passed while the behaviour they covered was broken, and every one failed
// the same way: the fixture was built by hand, so it could not express the thing
// that was wrong. A test that fabricates its own input proves the test compiles.
syntax = "proto3";

package testdata.v1;

import "garm/tool/v1/tool.proto";

option go_package = "github.com/garm-ai/garm-ai/testdata/v1;testdatav1";

message GetCustomerRequest  { string customer_id = 1; }
message GetCustomerResponse { string display_name = 1; }

message InvokeRequest { string request = 1; }
// Named InvokeResponse rather than RunRef purely to satisfy buf's
// RPC_RESPONSE_STANDARD_NAME. That is the SECOND naming rule STANDARD has fought
// in two steps, and the pattern is worth recording before real protos arrive:
//
//   - SERVICE_SUFFIX wants `SupportAssistantService`, where an agent is a named
//     actor and reads better without the suffix.
//   - RPC_RESPONSE_STANDARD_NAME wants InvokeResponse, where every agent's Invoke
//     returning one shared `RunRef` is good design -- and
//     RPC_REQUEST_RESPONSE_UNIQUE would then object to the sharing too.
//
// The previous estate hit all three, configured STANDARD anyway, and never ran it
// clean. So the decision is NOT being dodged, it is being deferred to the step
// that writes a real proto -- and until then the fixture bends, not the ruleset.
message InvokeResponse { string run_id = 1; }

// A plain tool: the service answers the call itself.
service AccountsService {
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse) {
    option (garm.tool.v1.tool) = { name: "accounts.v1.get_customer" };
  }
}

// An agent, which is a tool whose answer comes from a runner.
//
// Named with the `Service` suffix only because buf's STANDARD lint requires it,
// and this is throwaway scaffolding. Whether a real agent should be named that
// way is a genuine convention question -- an agent is a named actor rather than
// an RPC service -- and it is deliberately NOT decided here.
//
// What is NOT happening: silently dropping the rule. The estate this replaces
// configured STANDARD and never ran it clean -- `examples/bank` emits eight
// violations today, including this one -- so the config claimed one thing and the
// tree did another, and nothing noticed. A lint nobody honours is worse than no
// lint, because it reads as a guarantee.
service SupportAssistantService {
  rpc Invoke(InvokeRequest) returns (InvokeResponse) {
    // NOTE THE DELIBERATE MISMATCH between identity and address. This method's
    // proto full name is `testdata.v1.SupportAssistantService.Invoke`; the tool's
    // name is `support-assistant`. Different on purpose, so any code that
    // confuses an address for an identity fails a test rather than failing in
    // production three services away. The previous estate had that bug twice in
    // one day.
    //
    // And note the allowlist names `accounts.v1.get_customer` -- the same
    // spelling AccountsService declares above. One namespace, which is what
    // makes "an agent is a tool" a fact rather than a slogan.
    option (garm.tool.v1.tool) = {
      name: "support-assistant"
      agent: {
        tools: [
          { name: "accounts.v1.get_customer" },
          { name: "payments.v1.get_payment_status" }
        ]
      }
    };
  }
}
